{% extends 'base.html' %}

{% block title %}Check Your Email - SUA Student Housing{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h3 text-success fw-bold mb-3">Check your email</h1>
                <p class="text-muted">If an account exists for that email address, a password reset link will arrive shortly. Check your spam folder too.</p>
                <a href="{% url 'login' %}" class="btn btn-success mt-2">Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
