{% extends 'base.html' %}

{% block title %}Password Updated - SUA Student Housing{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h3 text-success fw-bold mb-3">Password updated</h1>
                <p class="text-muted">Your password has been changed. You can now sign in using the new password.</p>
                <a href="{% url 'login' %}" class="btn btn-success mt-2">Go to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
